<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{ --bg:#f7f7f6; --panel:#fff; --border:#e4e3e1; --ink:#19191a; --ink-2:#6b6b70;
  --primary:#19191a; --primary-ink:#fff; --mal:#b42318; color-scheme:light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111112; --panel:#1a1a1c; --border:#2b2b2e;
    --ink:#ececee; --ink-2:#9a9aa1; --primary:#ececee; --primary-ink:#141415;
    --mal:#f3968b; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#111112; --panel:#1a1a1c; --border:#2b2b2e;
  --ink:#ececee; --ink-2:#9a9aa1; --primary:#ececee; --primary-ink:#141415;
  --mal:#f3968b; color-scheme:dark }
body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
  color:var(--ink); font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif }
.caja{ background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:28px 26px; width:min(340px, calc(100vw - 32px)); text-align:center }
h1{ font-size:16px; font-weight:600; margin:0 0 6px }
p{ color:var(--ink-2); margin:0 0 18px }
.error{ color:var(--mal); margin-bottom:14px }
a.btn{ display:block; padding:9px 12px; border-radius:7px; background:var(--primary);
  color:var(--primary-ink); font-weight:600; text-decoration:none }
a.btn:focus-visible{ outline:2px solid #2563eb; outline-offset:2px }
</style>
</head>
<body>
<div class="caja">
  <h1>Calendario</h1>
  <p>Entra con tu cuenta de Google para ver el calendario del equipo.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if google %}
  <a class="btn" href="/crm/auth/google" target="_top">Entrar con Google</a>
  {% else %}
  <p>El login con Google no está configurado en esta instancia.</p>
  {% endif %}
</div>
</body>
</html>
