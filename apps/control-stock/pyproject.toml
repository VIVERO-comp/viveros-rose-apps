[project]
name = "control-stock"
version = "0.1.0"
description = "App de control de stock del vivero de Vivero Rose (FastAPI + Jinja2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    # Fichas de producto en la base tienda (Postgres del droplet).
    "psycopg[binary]>=3.2",
    # El feed del calendario que se suscribe en el teléfono (fase 1 del plan
    # de sincronización con Google/Apple, 22/09/2026).
    "icalendar>=7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
